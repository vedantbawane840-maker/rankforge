name = "rankforge-mcp"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
FIREBASE_PROJECT_ID = ""
FIREBASE_WEB_API_KEY = ""
# Note: ENCRYPTION_KEY must be stored as a Cloudflare Secret (wrangler secret put ENCRYPTION_KEY)

[[d1_databases]]
binding = "DB"
database_name = "rankforge-usage"
database_id = ""

[triggers]
crons = ["0 0 1 * *"]
